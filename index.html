<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        let gameOver = false;

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

    
            
        
        drawGame();

        
        
       
        
        function placeFood() {
            
            food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
            
        }

        

        function moveSnake() {
            if (gameOver) {return;}
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            const hitsBody = snake.some(segment => segment.x === head.x && segment.y === head.y);
            
            if(head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || hitsBody) {
                gameOver = true;
                alert("Game Over! Your score: " + score);
                snake = [
                    { x: 10, y: 10 },
                    { x: 9, y: 10 },
                    { x: 8, y: 10 }
                ];
                direction = { x: 1, y: 0 };
                score = 0;
                placeFood();
                return;
            
            }



            if (food.x === head.x && food.y === head.y){
                score++;
                placeFood();
            }
            else {
                snake.pop();
            }
            snake.unshift(head);
            drawGame();
            
            


            
        }
        
        document.addEventListener("keydown", (event) => {
                if (event.key === "ArrowUp" && direction.y !== 1) {
                    direction = { x: 0, y: -1 };
                } else if (event.key === "ArrowDown" && direction.y !== -1) {
                    direction = { x: 0, y: 1 };
                } else if (event.key === "ArrowLeft" && direction.x !== 1) {
                    direction = { x: -1, y: 0 };
                } else if (event.key === "ArrowRight" && direction.x !== -1) {
                    direction = { x: 1, y: 0 };
                } else if (event.key === "r" && gameOver) {
                    gameOver = false;
                    drawGame();
                }
        }); 
    
        setInterval(moveSnake, 100);
        
        
    
    
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
